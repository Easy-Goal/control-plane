# Segredo compartilhado (G2): o mesmo valor em vários projetos do cliente. `cp-secrets rotate <cli>/<grupo> <env>`
# grava o novo em todos os membros e sincroniza (signer por último). Gradual: <key>_PREVIOUS = antigo (as apps
# aceitam os dois; ponha <key>_PREVIOUS na allowlist dos targets); --finish encerra a janela; --maintenance troca
# sem janela. signer = "" quando quem assina está fora do cofre (ex.: api_apps.jwt_secret no banco do SSO).
# [[client.shared]]
# name = "sso-global"                 # eg_session de .easygoal.com.br (≥ 7 dias de janela: EG_SESSION_MAX_AGE)
# key = "SSO_JWT_SECRET"
# signer = "sso"
# [client.shared.members]
# prod = ["app-front", "api-backend", "sso"]
#
# [[client.shared]]                   # cliente vaygo: segredo do app VayGo no SSO (api_apps.jwt_secret)
# name = "sso-app"
# key = "SSO_JWT_SECRET"
# signer = ""
# signer_note = "salvar o valor novo em api_apps.jwt_secret do app VayGo (painel admin do SSO) DEPOIS do sync"
# [client.shared.members]
# prod = ["vaygo-api", "vaygo-web"]

