# Estado desejado dos segredos no OpenBao (ADR 062). Aplicar: scripts/cp-secrets plan → apply
# Só nomes e estrutura — nenhum valor aqui (versionado).
# Layout: kv/<projeto>/<ambiente>. Policy <projeto>-<ambiente>-read lê só aquele caminho, então cada
# identidade de runtime enxerga exatamente um ambiente (dev nunca lê prod).

[[project]]
slug = "health-stay"
environments = ["dev", "staging", "prod"]

# .env local como fonte inicial do ambiente (só cria chaves que faltam; o OpenBao vence depois).
[[project.repo]]
path = "~/projects/easy/health-stay-backend"
import_env = { file = ".env", environment = "dev" }

# Uma AppRole por app/ambiente: é o que o servidor (hoje esta máquina, depois Coolify na VPS) usa
# no lugar de .env. Credencial em openbao/runtime/<nome>.env (600, fora do git).
[[project.runtime]]
identity = "health-stay-api-dev"
environment = "dev"
