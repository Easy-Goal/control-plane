# Estado desejado dos segredos no OpenBao (ADR 062/063). Aplicar: scripts/cp-secrets plan → apply
# Só nomes e estrutura — nenhum valor aqui (versionado).
#
# Layout: kv/<cliente>/<projeto>/<ambiente>  → policy <cliente>-<projeto>-<ambiente>-read (uma identidade de
#         runtime enxerga exatamente um ambiente; dev nunca lê prod)
#         kv/<cliente>/_providers/<provedor> → credenciais de operação (Coolify, Vercel…), lidas só pela
#         identidade cp-sync-<cliente>
# O cliente é dono das contas; a Easy Goal opera com o Bitwarden dele e sai pelo `cp-secrets offboard`.
# A própria Easy Goal é o cliente "easygoal" (não passa por offboard).

[[client]]
slug = "easygoal"

# Credenciais de operação: campos em kv/easygoal/_providers/<name> (cp-secrets provider set).
[[client.provider]]
name = "coolify-sim"     # Coolify do control plane simulado (sim/, etapa 4)
kind = "coolify"

[[client.provider]]
name = "vercel"          # time da Easy Goal na Vercel (token com escopo do time e expiração)
kind = "vercel"

[[client.provider]]
name = "github"          # GitHub App da Easy Goal (app_id, installation_id, private_key) — README "GitHub App"
kind = "github"

[[client.project]]
slug = "health-stay"
environments = ["dev", "staging", "prod"]
legacy_path = "health-stay"   # 1x: move kv/health-stay/<env> (layout do ADR 062); remover depois do apply

# .env local como fonte inicial do ambiente (só cria chaves que faltam; o OpenBao vence depois).
[[client.project.repo]]
path = "~/projects/easy/health-stay-backend"
import_env = { file = ".env", environment = "dev" }

# Pull (só dev local): `cp-secrets run <identidade> -- <cmd>`. Credencial em openbao/runtime/<nome>.env.
[[client.project.runtime]]
identity = "health-stay-api-dev"
environment = "dev"

# Push: `cp-secrets sync plan|apply`. `keys` é a allowlist (obrigatória): só essas chaves vão para o
# destino; o resto do ambiente (ex.: DATABASE_URL local) nunca sai do cofre.
[[client.project.target]]
name = "api-staging-sim"
provider = "coolify-sim"
environment = "staging"
resource = "service"
resource_name = "health-stay-api-staging"   # service no Coolify (cp-coolify service ensure)
keys = ["NODE_ENV", "POSTGRES_USER", "POSTGRES_PASSWORD", "DB_HOST", "JWT_SECRET", "JWT_EXPIRES_IN",
        "REFRESH_TOKEN_TTL", "AES_KEY", "DEMO_USER_PASSWORD"]
health_url = "http://127.0.0.1:3101/health/ready"

# prd do laboratório (VPS prd). Sem DEMO_USER_PASSWORD: usuário de demonstração não existe em produção.
[[client.project.target]]
name = "api-prod-sim"
provider = "coolify-sim"
environment = "prod"
resource = "service"
resource_name = "health-stay-api-prod"
keys = ["NODE_ENV", "POSTGRES_USER", "POSTGRES_PASSWORD", "DB_HOST", "JWT_SECRET", "JWT_EXPIRES_IN",
        "REFRESH_TOKEN_TTL", "AES_KEY"]
health_url = "http://127.0.0.1:3102/health/ready"

# Exemplo de destino GitHub (secrets do Actions): repo = "org/nome"; github_environment opcional.
# [[client.project.target]]
