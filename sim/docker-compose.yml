# Laboratório do control plane (ADR 064, fase A): as mesmas máquinas da topologia real, cada uma um Ubuntu
# com Docker próprio, instaladas pelos MESMOS scripts de install/ que vão para a VPS real.
#   sim-cp        control plane: Coolify (painel 127.0.0.1:8000) + OpenBao TLS (127.0.0.1:8210)
#   sim-vps-dev   VPS dev compartilhada (dev/staging de todos os projetos) → API staging em 127.0.0.1:3101
#   sim-vps-prd   VPS prd do Health Stay                                    → API prd em 127.0.0.1:3102
#   sim-registry  imagens das apps (no lugar do GHCR até a fase C)
#   sim-s3        S3 dos backups dos bancos (SeaweedFS; na VPS real: R2/Spaces)
# Tudo por sim/lab.sh up | verify | down. A rede 172.30.50.0/24 faz o papel da tailnet.
name: cp-sim

x-host: &host
  build: .
  image: cp-sim-host:local
  privileged: true
  restart: unless-stopped
  volumes:
    - ../install:/opt/cp-install:ro

services:
  sim-cp:
    <<: *host
    hostname: sim-cp
    volumes:
      - ../install:/opt/cp-install:ro
      - cp_docker:/var/lib/docker
      - cp_data:/data
    ports:
      - "127.0.0.1:8000:8000"   # painel/API do Coolify
      - "127.0.0.1:8210:8200"   # OpenBao do control plane (ensaio da migração do cofre)
    networks:
      sim: { ipv4_address: 172.30.50.10 }

  sim-vps-dev:
    <<: *host
    hostname: sim-vps-dev
    volumes:
      - ../install:/opt/cp-install:ro
      - dev_docker:/var/lib/docker
    ports:
      - "127.0.0.1:3101:3001"
    networks:
      sim: { ipv4_address: 172.30.50.20 }

  sim-vps-prd:
    <<: *host
    hostname: sim-vps-prd
    volumes:
      - ../install:/opt/cp-install:ro
      - prd_docker:/var/lib/docker
    ports:
      - "127.0.0.1:3102:3001"
    networks:
      sim: { ipv4_address: 172.30.50.21 }

  # S3 do laboratório para os backups dos bancos (na VPS real: R2/Spaces). SeaweedFS: o MinIO saiu do Docker Hub.
  # Chaves em sim/.s3.json (geradas pelo lab.sh, 600, fora do git).
  sim-s3:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    restart: unless-stopped
    volumes:
      - s3_data:/data
      - ./.s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      sim: { ipv4_address: 172.30.50.40 }

  sim-registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      sim: { ipv4_address: 172.30.50.30 }

# IPs fixos: o Coolify roda no Docker aninhado do sim-cp e não resolve os nomes desta rede.
networks:
  sim:
    ipam:
      config:
        - subnet: 172.30.50.0/24

volumes:
  cp_docker:
  cp_data:
  dev_docker:
  prd_docker:
  registry_data:
  s3_data:
