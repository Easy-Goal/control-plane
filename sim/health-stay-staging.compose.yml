# Health Stay (API) como service do Coolify na VPS simulada — etapa 4 (ADR 063).
# Mesmo padrão do compose do repo: só interpola variáveis; os valores chegam pelo `cp-secrets sync`
# (allowlist do target api-staging-sim). Imagens do registry do ensaio (na VPS real: build do GitHub).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthstay
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d healthstay"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: 172.30.50.30:5000/health-stay-migrate:dev
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/healthstay
    depends_on:
      db:
        condition: service_healthy

  api:
    image: 172.30.50.30:5000/health-stay-api:dev
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL}
      AES_KEY: ${AES_KEY}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
      TRUST_PROXY: "0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/healthstay
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pg_data:
