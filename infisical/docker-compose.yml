# Infisical self-hosted (ADR 061, etapa 2): fonte única dos segredos dos projetos.
#   ../scripts/bootstrap-env.sh infisical   (gera infisical/.env uma vez, sem imprimir valores)
#   docker compose up -d --wait
# Painel só em 127.0.0.1 (e na tailnet via `tailscale serve`); nunca em todas as interfaces.
name: cp-infisical

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: infisical
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode scripts/bootstrap-env.sh infisical}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  infisical:
    image: infisical/infisical:v0.167.2
    restart: unless-stopped
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?rode scripts/bootstrap-env.sh infisical}
      AUTH_SECRET: ${AUTH_SECRET:?rode scripts/bootstrap-env.sh infisical}
      DB_CONNECTION_URI: postgres://infisical:${POSTGRES_PASSWORD}@db:5432/infisical
      REDIS_URL: redis://redis:6379
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${INFISICAL_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

volumes:
  pg_data:
  redis_data:
